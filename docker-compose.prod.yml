services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: camlife-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-camlife}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # 注意：POSTGRES_PASSWORD 必须从 .env 文件设置
      # 如果未设置，请创建 .env 文件并配置
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required. Please create .env file.}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - camlife_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 生产环境不暴露端口，仅内部访问
    # ports:
    #   - "5432:5432"

  # Database Migration Service
  migration:
    image: ghcr.io/lc4t/camlife-dev:latest
    command: bun run scripts/drizzle-migrate.ts
    environment:
      # DATABASE_URL is automatically generated from PostgreSQL configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-camlife}
      SKIP_ENV_VALIDATION: "true"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - camlife_network
    restart: "no"
    # 使用 web 镜像，但只运行迁移脚本
    # 需要将迁移脚本复制到镜像中

  # Next.js Web Application
  web:
    image: ghcr.io/lc4t/camlife-dev:latest
    container_name: camlife-web
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # DATABASE_URL is automatically generated from PostgreSQL configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-camlife}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      SKIP_ENV_VALIDATION: "true"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - camlife_network
    # 健康检查
    # 使用简单的端口检查（更可靠，不依赖外部工具）
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/3000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    name: camlife_postgres_data

networks:
  camlife_network:
    name: camlife_network
    driver: bridge

