pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bunx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: |
        OUTPUT=$(bun run typecheck 2>&1)
        FILTERED=$(echo "$OUTPUT" | grep -v 'node_modules/gsap' || true)
        if [ -n "$FILTERED" ] && echo "$FILTERED" | grep -q "error TS"; then
          echo "$FILTERED"
          exit 1
        fi
        exit 0

commit-msg:
  commands:
    "lint commit message":
      run: bunx commitlint --edit {1}

pre-push:
  commands:
    test:
      run: bun run test